name: Test Keyer
on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: ${{ matrix.display }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            distribution: temurin
            display: "macOS 15"
          - os: macos-26
            arch: arm64
            distribution: temurin
            display: "macOS 26"

          - os: macos-15-intel
            arch: x64
            distribution: temurin
            display: "macOS 15 Intel"
          - os: macos-26-intel
            arch: x64
            distribution: temurin
            display: "macOS 26 Intel"

          - os: windows-2022
            arch: x64
            distribution: temurin
            display: "Windows Server 2022"
          - os: windows-2025
            arch: x64
            distribution: temurin
            display: "Windows Server 2025"

          - os: windows-11-arm
            arch: arm64
            distribution: microsoft
            display: "Windows 11 Arm64"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: ${{ matrix.distribution }}
          architecture: ${{ matrix.arch }}
          cache: 'maven'

      - name: Test on ${{ matrix.display }}
        run: mvn test -DargLine="--enable-native-access=ALL-UNNAMED"